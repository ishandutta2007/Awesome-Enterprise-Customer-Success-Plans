<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.12)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.05)" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(192, 132, 252, 0.12)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.05)" />
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(52, 211, 153, 0.12)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.05)" />
    </linearGradient>

    <!-- Glowing Orb Filters -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0% { transform: scale(0.9) translate(0, 0); opacity: 0.45; }
        50% { transform: scale(1.15) translate(25px, -20px); opacity: 0.75; }
        100% { transform: scale(0.9) translate(0, 0); opacity: 0.45; }
      }

      @keyframes floatCard1 {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }

      @keyframes floatCard2 {
        0% { transform: translateY(0px); }
        50% { transform: translateY(12px); }
        100% { transform: translateY(0px); }
      }

      @keyframes floatCard3 {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }

      @keyframes orbitFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 600; }
      }

      .glow-orb-1 {
        animation: pulseGlow 10s ease-in-out infinite;
        transform-origin: 200px 100px;
      }

      .glow-orb-2 {
        animation: pulseGlow 12s ease-in-out infinite reverse;
        transform-origin: 1000px 320px;
      }

      .floating-card-1 {
        animation: floatCard1 6s ease-in-out infinite;
      }

      .floating-card-2 {
        animation: floatCard2 7s ease-in-out infinite;
      }

      .floating-card-3 {
        animation: floatCard3 6.5s ease-in-out infinite;
      }

      .circuit-line {
        stroke-dasharray: 20, 10;
        animation: orbitFlow 25s linear infinite;
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.01em;
      }

      .chip-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.02em;
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGradient)" rx="16" />

  <!-- Animated Glowing Orbs (Soft, Background-Only) -->
  <g filter="url(#glowFilter)">
    <circle cx="220" cy="120" r="140" fill="#38bdf8" class="glow-orb-1" />
    <circle cx="980" cy="300" r="160" fill="#8b5cf6" class="glow-orb-2" />
    <circle cx="600" cy="380" r="110" fill="#06b6d4" opacity="0.25" />
  </g>

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="420" fill="url(#gridPattern)" rx="16" />

  <!-- Dynamic Circuit / Flow Lines in Midground -->
  <g fill="none" opacity="0.3">
    <path class="circuit-line" d="M 50 80 Q 300 20 600 80 T 1150 60" stroke="#38bdf8" stroke-width="1.5" />
    <path class="circuit-line" d="M 50 350 Q 400 390 800 340 T 1150 360" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Background Dynamic Metric Cards (Arranged to Keep Central Text Clear) -->
  <!-- Card 1: Top Right Metric -->
  <g class="floating-card-1" transform="translate(930, 45)">
    <rect width="210" height="60" rx="10" fill="url(#cardGrad1)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
    <circle cx="28" cy="30" r="12" fill="rgba(56, 189, 248, 0.2)" />
    <text x="28" y="34" font-size="12" fill="#38bdf8" text-anchor="middle">⚡</text>
    <text x="50" y="27" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">CRITICAL SLA</text>
    <text x="50" y="46" font-family="sans-serif" font-size="15" font-weight="700" fill="#38bdf8">&lt; 15-Min Response</text>
  </g>

  <!-- Card 2: Bottom Right Metric -->
  <g class="floating-card-2" transform="translate(940, 310)">
    <rect width="200" height="60" rx="10" fill="url(#cardGrad2)" stroke="rgba(192, 132, 252, 0.25)" stroke-width="1" />
    <circle cx="28" cy="30" r="12" fill="rgba(192, 132, 252, 0.2)" />
    <text x="28" y="34" font-size="12" fill="#c084fc" text-anchor="middle">🎯</text>
    <text x="50" y="27" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">RETENTION TARGET</text>
    <text x="50" y="46" font-family="sans-serif" font-size="15" font-weight="700" fill="#c084fc">125%+ NRR Focus</text>
  </g>

  <!-- Card 3: Bottom Left Metric -->
  <g class="floating-card-3" transform="translate(60, 310)">
    <rect width="210" height="60" rx="10" fill="url(#cardGrad3)" stroke="rgba(52, 211, 153, 0.25)" stroke-width="1" />
    <circle cx="28" cy="30" r="12" fill="rgba(52, 211, 153, 0.2)" />
    <text x="28" y="34" font-size="12" fill="#34d399" text-anchor="middle">🛡️</text>
    <text x="50" y="27" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">ACCOUNT HEALTH</text>
    <text x="50" y="46" font-family="sans-serif" font-size="15" font-weight="700" fill="#34d399">Dedicated TAM / CSM</text>
  </g>

  <!-- Card 4: Top Left Metric -->
  <g class="floating-card-1" transform="translate(60, 45)">
    <rect width="200" height="60" rx="10" fill="url(#cardGrad1)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
    <circle cx="28" cy="30" r="12" fill="rgba(56, 189, 248, 0.2)" />
    <text x="28" y="34" font-size="12" fill="#38bdf8" text-anchor="middle">🌐</text>
    <text x="50" y="27" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">COMMUNITY ECOSYSTEM</text>
    <text x="50" y="46" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">SaaS &amp; Open Source</text>
  </g>

  <!-- FOREGROUND CONTENT: Highly Legible & Prominent -->
  <!-- Top Category Badge Pill -->
  <g transform="translate(600, 95)">
    <rect x="-165" y="-18" width="330" height="36" rx="18" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1" />
    <circle cx="-140" cy="0" r="5" fill="#34d399" />
    <text x="-125" y="5" class="chip-text" fill="#e2e8f0">ENTERPRISE CUSTOMER SUCCESS ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="175" class="title-text" text-anchor="middle" font-size="44" fill="url(#primaryTextGrad)" filter="drop-shadow(0px 3px 12px rgba(0,0,0,0.6))">
    Awesome Customer Success Plans
  </text>

  <!-- Subtitle -->
  <text x="600" y="222" class="subtitle-text" text-anchor="middle" font-size="19" fill="#cbd5e1">
    Curated Enterprise Support Tiers, CSM SaaS Platforms &amp; Open-Source Helpdesks
  </text>

  <!-- Feature Tags / Pills Bar -->
  <g transform="translate(600, 275)">
    <!-- Pill 1: Mission-Critical SLAs -->
    <g transform="translate(-255, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <text x="0" y="4.5" class="chip-text" fill="#7dd3fc" text-anchor="middle">🚀 Mission SLAs</text>
    </g>
    <!-- Pill 2: Dedicated TAM/CSM -->
    <g transform="translate(-85, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="rgba(129, 140, 248, 0.1)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
      <text x="0" y="4.5" class="chip-text" fill="#a5b4fc" text-anchor="middle">🤝 Dedicated TAM</text>
    </g>
    <!-- Pill 3: Self-Hosted &amp; FOSS -->
    <g transform="translate(85, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="rgba(192, 132, 252, 0.1)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
      <text x="0" y="4.5" class="chip-text" fill="#d8b4fe" text-anchor="middle">🔓 Open-Source</text>
    </g>
    <!-- Pill 4: NRR &amp; Churn Defense -->
    <g transform="translate(255, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="rgba(52, 211, 153, 0.1)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1" />
      <text x="0" y="4.5" class="chip-text" fill="#6ee7b7" text-anchor="middle">📈 NRR Defense</text>
    </g>
  </g>

  <!-- Border Frame Accent -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
</svg>
